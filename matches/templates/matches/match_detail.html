<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ match.location }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="card-title">⚽ {{ match.location }}</h1>
        <p class="lead">{{ match.starts_at|date:"l j F Y, H:i" }}</p>
        <p>Giocatori: <span class="badge bg-warning">{{ match.max_players }}</span></p>
        {% if match.visibility == "public" %}
  <span class="badge bg-info">{{ match.get_visibility_display }}</span>
{% else %}
  <span class="badge bg-secondary">{{ match.get_visibility_display }}</span>
{% endif %}
      </div>
    </div>
  </div>
</body>
</html>
